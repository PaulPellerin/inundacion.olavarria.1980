        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        })
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var title = new L.Control({'position':'topright'});
        title.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };
        title.update = function () {
            this._div.innerHTML = '<h2>Cartografía de registros fotográficos históricos de la inundación de 1980 en Olavarría (Provincia de Buenos Aires)</h2>';
        };
        title.addTo(map);
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
            if (bounds_group.getLayers().length) {
                map.fitBounds(bounds_group.getBounds());
            }
        }
        map.createPane('pane_OSMStandard_0');
        map.getPane('pane_OSMStandard_0').style.zIndex = 400;
        var layer_OSMStandard_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane: 'pane_OSMStandard_0',
            opacity: 1.0,
            attribution: '<a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors, CC-BY-SA</a>',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        layer_OSMStandard_0;
        map.addLayer(layer_OSMStandard_0);
        function pop_PartidodeOlavarra_1(feature, layer) {
            var popupContent = '<table>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_PartidodeOlavarra_1_0() {
            return {
                pane: 'pane_PartidodeOlavarra_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '10.0,2.0',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 2.0, 
                fillOpacity: 0,
                interactive: false,
            }
        }
        map.createPane('pane_PartidodeOlavarra_1');
        map.getPane('pane_PartidodeOlavarra_1').style.zIndex = 401;
        map.getPane('pane_PartidodeOlavarra_1').style['mix-blend-mode'] = 'normal';
        var layer_PartidodeOlavarra_1 = new L.geoJson(json_PartidodeOlavarra_1, {
            attribution: '',
            interactive: false,
            dataVar: 'json_PartidodeOlavarra_1',
            layerName: 'layer_PartidodeOlavarra_1',
            pane: 'pane_PartidodeOlavarra_1',
            onEachFeature: pop_PartidodeOlavarra_1,
            style: style_PartidodeOlavarra_1_0,
        });
        bounds_group.addLayer(layer_PartidodeOlavarra_1);
        map.addLayer(layer_PartidodeOlavarra_1);
        function pop_Barrios_2(feature, layer) {
            var popupContent = '<table>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Barrios_2_0() {
            return {
                pane: 'pane_Barrios_2',
                opacity: 1,
                color: 'rgba(255,0,3,1.0)',
                dashArray: '5.0,1.0,2.0,1.0',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fillOpacity: 0,
                interactive: false,
            }
        }
        map.createPane('pane_Barrios_2');
        map.getPane('pane_Barrios_2').style.zIndex = 402;
        map.getPane('pane_Barrios_2').style['mix-blend-mode'] = 'normal';
        var layer_Barrios_2 = new L.geoJson(json_Barrios_2, {
            attribution: '',
            interactive: false,
            dataVar: 'json_Barrios_2',
            layerName: 'layer_Barrios_2',
            pane: 'pane_Barrios_2',
            onEachFeature: pop_Barrios_2,
            style: style_Barrios_2_0,
        });
        bounds_group.addLayer(layer_Barrios_2);
        map.addLayer(layer_Barrios_2);
        map.createPane('pane_ModelodigitaldeelevacionesDEM_3');
        map.getPane('pane_ModelodigitaldeelevacionesDEM_3').style.zIndex = 403;
        var img_ModelodigitaldeelevacionesDEM_3 = 'data/ModelodigitaldeelevacionesDEM_3.png';
        var img_bounds_ModelodigitaldeelevacionesDEM_3 = [[-37.375299483,-61.423226696],[-36.342057243,-60.000564781]];
        var layer_ModelodigitaldeelevacionesDEM_3 = new L.imageOverlay(img_ModelodigitaldeelevacionesDEM_3,
                                              img_bounds_ModelodigitaldeelevacionesDEM_3,
                                              {pane: 'pane_ModelodigitaldeelevacionesDEM_3'});
        bounds_group.addLayer(layer_ModelodigitaldeelevacionesDEM_3);
        map.addLayer(layer_ModelodigitaldeelevacionesDEM_3);
map.on("layerremove", function(e){
    if (e.layer === layer_ModelodigitaldeelevacionesDEM_3){
        document.getElementById("leyendaDEM").style.display = "none";
    }
});

map.on("layeradd", function(e){
    if (e.layer === layer_ModelodigitaldeelevacionesDEM_3){
        document.getElementById("leyendaDEM").style.display = "block";
    }
});
        function pop_Cuerposdeagua_4(feature, layer) {
            var popupContent = '<table>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Cuerposdeagua_4_0() {
            return {
                pane: 'pane_Cuerposdeagua_4',
                opacity: 1,
                color: 'rgba(100,152,210,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(165,191,221,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_Cuerposdeagua_4');
        map.getPane('pane_Cuerposdeagua_4').style.zIndex = 404;
        map.getPane('pane_Cuerposdeagua_4').style['mix-blend-mode'] = 'normal';
        var layer_Cuerposdeagua_4 = new L.geoJson(json_Cuerposdeagua_4, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Cuerposdeagua_4',
            layerName: 'layer_Cuerposdeagua_4',

        });
        bounds_group.addLayer(layer_Cuerposdeagua_4);
        map.addLayer(layer_Cuerposdeagua_4);
        function pop_Cursosdeagua_5(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Nombre'] !== null ? autolinker.link(String(feature.properties['Nombre']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Cursosdeagua_5_0(feature) {
            switch(String(feature.properties['Condición'])) {
                case 'Permanente':
                    return {
                pane: 'pane_Cursosdeagua_5',
                opacity: 1,
                color: 'rgba(100,152,210,1.0)',
                dashArray: '',
                lineCap: 'round',
                lineJoin: 'round',
                weight: 2.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
                case 'Temporario':
                    return {
                pane: 'pane_Cursosdeagua_5',
                opacity: 1,
                color: 'rgba(100,152,210,1.0)',
                dashArray: '1.0,2.0',
                lineCap: 'round',
                lineJoin: 'round',
                weight: 1.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_Cursosdeagua_5');
        map.getPane('pane_Cursosdeagua_5').style.zIndex = 405;
        map.getPane('pane_Cursosdeagua_5').style['mix-blend-mode'] = 'normal';
        var layer_Cursosdeagua_5 = new L.geoJson(json_Cursosdeagua_5, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Cursosdeagua_5',
            layerName: 'layer_Cursosdeagua_5',
            pane: 'pane_Cursosdeagua_5',
            onEachFeature: pop_Cursosdeagua_5,
            style: style_Cursosdeagua_5_0,
        });
        bounds_group.addLayer(layer_Cursosdeagua_5);
        map.addLayer(layer_Cursosdeagua_5);
        function pop_Imgenes_6(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Ubicación</th>\
                        <td class="visible-with-data" id="Ubicación">' + (feature.properties['Ubicación'] !== null ? autolinker.link(String(feature.properties['Ubicación']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Fuente</th>\
                        <td class="visible-with-data" id="Fuente">' + (feature.properties['Fuente'] !== null ? autolinker.link(String(feature.properties['Fuente']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Descripción'] !== null ? autolinker.link(String(feature.properties['Descripción']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Imagen'] !== null ? '<img src="images/' + String(feature.properties['Imagen']).replace(/[\\/:]/g, '_').trim().replace(/'/g, '\'').replace(/"/g, '&quot;') + '">' : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Imgenes_6_0() {
            return {
                pane: 'pane_Imgenes_6',
        rotationAngle: 0.0174533,
        rotationOrigin: 'center center',
        icon: L.icon({
            iconUrl: 'markers/Imgenes_6.svg',
            iconSize: [25.08, 25.08]
        }),
                interactive: true,
            }
        }
        map.createPane('pane_Imgenes_6');
        map.getPane('pane_Imgenes_6').style.zIndex = 406;
        map.getPane('pane_Imgenes_6').style['mix-blend-mode'] = 'normal';
        var layer_Imgenes_6 = new L.geoJson(json_Imgenes_6, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Imgenes_6',
            layerName: 'layer_Imgenes_6',
            pane: 'pane_Imgenes_6',
            onEachFeature: pop_Imgenes_6,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.marker(latlng, style_Imgenes_6_0(feature));
            },
        });
        bounds_group.addLayer(layer_Imgenes_6);
        map.addLayer(layer_Imgenes_6);
        var overlaysTree = [
            {label: '<img src="legend/Imgenes_6.png" /> Imágenes', layer: layer_Imgenes_6},
            {label: 'Cursos de agua<br /><table><tr><td style="text-align: center;"><img src="legend/Cursosdeagua_5_Permanente0.png" /></td><td>Permanente</td></tr><tr><td style="text-align: center;"><img src="legend/Cursosdeagua_5_Temporario1.png" /></td><td>Temporario</td></tr></table>', layer: layer_Cursosdeagua_5},
            {label: '<img src="legend/Cuerposdeagua_4.png" /> Cuerpos de agua', layer: layer_Cuerposdeagua_4},
            {label: "Modelo digital de elevaciones (DEM)", layer: layer_ModelodigitaldeelevacionesDEM_3},
            {label: '<img src="legend/Barrios_2.png" /> Barrios', layer: layer_Barrios_2},
            {label: '<img src="legend/PartidodeOlavarra_1.png" /> Partido de Olavarría', layer: layer_PartidodeOlavarra_1},
            {label: "OSM Standard", layer: layer_OSMStandard_0, radioGroup: 'bm' },]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: true,
        });
        lay.addTo(map);
        setBounds();
        var i = 0;
        layer_Cuerposdeagua_4.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((layer.feature.properties['fna'] !== null?String('<div style="color: #0011a3; font-size: 10pt; font-family: \'Times New Roman\', sans-serif;">' + layer.feature.properties['fna']) + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_Cuerposdeagua_4'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        L.ImageOverlay.include({
            getBounds: function () {
                return this._bounds;
            }
        });
        resetLabels([layer_Cuerposdeagua_4]);
        map.on("zoomend", function(){
            resetLabels([layer_Cuerposdeagua_4]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_Cuerposdeagua_4]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_Cuerposdeagua_4]);
        });
        </script>
